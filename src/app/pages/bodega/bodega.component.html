<div class="bg-gray-100">
  <div class="volver-container mb-4">
    <button class="volver-button bg-orange-500 hover:bg-orange-700 text-white font-bold py-2 px-4 rounded" (click)="navigateHome()">Volver</button>
  </div>
  <div class="bodegas-all">
    <div *ngIf="bodega && currentPage === 1" class="bodega-container mb-8">
      <h1 class="text-3xl font-bold mb-4">{{ bodega.nombre }}</h1>
      <div class="visitas-container flex items-center mb-4">
        <span class="material-icons mr-2">visibility</span>
        <span>{{ bodega.visitas }}</span>
      </div>
      <img *ngIf="bodega.imgVisible === 'S'" [src]="bodega.imgUrl" alt="{{ bodega.nombre }}" class="bodega-img w-full h-auto rounded mb-4">
      <p [innerHTML]="getSanitizedDescription(bodega.descripcion)" class="mb-4"></p>
      <p *ngIf="bodega.texto" class="mb-4">{{ bodega.texto }}</p>
    </div>

    <div #etiquetasTable class="etiquetas-container mb-8">
      <table mat-table [dataSource]="etiquetas" class="mat-elevation-z8 etiquetas-table w-full">
        <ng-container matColumnDef="imgUrl1">
          <th mat-header-cell *matHeaderCellDef class="p-2"> Etiquetas </th>
          <td mat-cell *matCellDef="let etiqueta" class="p-2">
            <img *ngIf="etiqueta.imgUrl1"
                 [src]="etiqueta.imgUrl1"
                 alt="Etiqueta 1"
                 class="etiqueta-img w-24 h-auto cursor-pointer"
                 (click)="enlargeImage(etiqueta.imgUrl1)">
          </td>
        </ng-container>
        <ng-container matColumnDef="imgUrl2">
          <th mat-header-cell *matHeaderCellDef class="p-2"> </th>
          <td mat-cell *matCellDef="let etiqueta" class="p-2">
            <img *ngIf="etiqueta.imgUrl2"
                 [src]="etiqueta.imgUrl2"
                 alt="Etiqueta 2"
                 class="etiqueta-img w-24 h-auto cursor-pointer"
                 (click)="enlargeImage(etiqueta.imgUrl2)">
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns" class="bg-gray-100"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="etiqueta-row hover:bg-gray-50"></tr>
      </table>
      <div class="paginator-container flex items-center justify-center mt-4">
        <button class="paginator-button bg-orange-500 hover:bg-orange-700 text-white font-bold py-2 px-4 rounded" (click)="goToPage(currentPage - 1)" [disabled]="currentPage <= 1">Anterior</button>
        <span class="paginator-current-page mx-2">Página</span>
        <mat-form-field class="paginator-select-field mx-2">
          <mat-select [(value)]="currentPage" (selectionChange)="goToPage($event.value)">
            <mat-option *ngFor="let page of pageOptions" [value]="page">{{ page }}</mat-option>
          </mat-select>
        </mat-form-field>
        <span class="paginator-current-page mx-2">de {{ totalPages }}</span>
        <button class="paginator-button bg-orange-500 hover:bg-orange-700 text-white font-bold py-2 px-4 rounded" (click)="goToPage(currentPage + 1)" [disabled]="currentPage >= totalPages">Siguiente</button>
      </div>
    </div>

    <app-image-modal
      [imageUrl]="selectedImage"
      [disablePrev]="disablePrev"
      [disableNext]="disableNext"
      (close)="handleCloseModal()"
      (next)="navigateImage('next')"
      (prev)="navigateImage('prev')">
    </app-image-modal>
  </div>
  <div *ngIf="comentarios" class="comentarios mt-8">
    <app-comentarios [codBodega]="codBodega!"></app-comentarios>
  </div>
</div>
